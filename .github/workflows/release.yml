name: Release

# Runs when a v* tag is pushed, when package.json changes on main, or by hand.
# 1. Creates GitHub release vX.Y.Z (with .vsix + Chrome .zip) if it doesn't exist yet.
# 2. Publishes the .vsix to the VS Code Marketplace (secret VSCE_PAT) and
#    Open VSX (trusted publishing via OIDC, falling back to secret OVSX_PAT), and the Chrome zip to the Chrome Web Store
#    (secrets CWS_SA_KEY = service account JSON key, CWS_PUBLISHER_ID).
#    Each step is skipped when its secrets are missing, and a version that is
#    already published is treated as success.
on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['package.json', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write   # Open VSX trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
      CWS_SA_KEY: ${{ secrets.CWS_SA_KEY }}
      CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
      CWS_EXTENSION_ID: kmikbnmoacgjjigohbcbmppccjidmacc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Resolve version
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then TAG="${GITHUB_REF_NAME#v}"
          else TAG=$(node -p "require('./package.json').version"); fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "v$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub release v$TAG already exists."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - run: npm ci
      - name: Check versions match
        run: |
          TAG="${{ steps.v.outputs.tag }}"
          PKG=$(node -p "require('./package.json').version")
          CHR=$(node -p "require('./chrome/manifest.json').version")
          echo "tag=$TAG package.json=$PKG chrome/manifest.json=$CHR"
          if [ "$TAG" != "$PKG" ] || [ "$TAG" != "$CHR" ]; then
            echo "::error::Version mismatch. Bump package.json and chrome/manifest.json to $TAG."
            exit 1
          fi
      - run: npm run typecheck
      - run: npm run package
      - run: npm run package:chrome
      - name: Release notes from CHANGELOG
        if: steps.v.outputs.exists != 'true'
        run: |
          TAG="${{ steps.v.outputs.tag }}"
          awk -v v="## $TAG" 'index($0, v)==1 {f=1; next} /^## /{if(f) exit} f' CHANGELOG.md > notes.md
          {
            echo
            echo "### Kurulum / Install"
            echo "- **VS Code:** Marketplace'te *Panoptent* ara / search *Panoptent* in Extensions — or *Install from VSIX…* → \`panoptent-$TAG.vsix\`"
            echo "- **Chrome:** unzip \`panoptent-chrome-$TAG.zip\` → \`chrome://extensions\` → Developer mode → *Load unpacked*"
            echo
            echo "Rehber / Guide: https://ceritli.github.io/panoptent/"
          } >> notes.md
          cat notes.md
      - name: Create GitHub release
        if: steps.v.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.v.outputs.tag }}"
          gh release create "$TAG" --target "$GITHUB_SHA" \
            --title "Panoptent $TAG" \
            --notes-file notes.md \
            panoptent-*.vsix panoptent-chrome-*.zip
      - name: Publish to VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: |
          VSIX="panoptent-${{ steps.v.outputs.tag }}.vsix"
          if out=$(npx vsce publish --packagePath "$VSIX" 2>&1); then echo "$out"
          else
            echo "$out"
            echo "$out" | grep -qi "already exists" && echo "Already on the Marketplace — OK." || exit 1
          fi
      - name: Publish to Open VSX (Cursor, Windsurf, VSCodium…)
        # Trusted publishing first (registered on open-vsx.org for this repo +
        # release.yml); OVSX_PAT is only a fallback. ovsx prefers a PAT when
        # one is in the environment, so it is unset for the OIDC attempt.
        # ovsx is pinned: a bare `npx ovsx` can reuse an old cached copy
        # without --trusted-publishing (needs >= 1.3.0).
        run: |
          VSIX="panoptent-${{ steps.v.outputs.tag }}.vsix"
          ok() { echo "$1"; echo "$1" | grep -qi "already" && echo "Already on Open VSX — OK."; }
          if out=$(env -u OVSX_PAT npx --yes ovsx@1.3.0 publish "$VSIX" --trusted-publishing 2>&1); then echo "$out"; exit 0; fi
          ok "$out" && exit 0
          if [ -z "$OVSX_PAT" ]; then echo "::error::Trusted publishing failed and OVSX_PAT is not set."; exit 1; fi
          echo "Trusted publishing failed — retrying with OVSX_PAT."
          if out=$(npx --yes ovsx@1.3.0 publish "$VSIX" -p "$OVSX_PAT" 2>&1); then echo "$out"; exit 0; fi
          ok "$out" || exit 1
      - name: Publish to Chrome Web Store
        # Chrome Web Store API v2 with a service account (one per publisher,
        # added in the Developer Dashboard → Account). The access token is
        # minted here from the JSON key (JWT bearer grant), so no extra Google
        # Cloud API or IAM role is needed besides the Chrome Web Store API.
        if: env.CWS_SA_KEY != '' && env.CWS_PUBLISHER_ID != ''
        run: |
          set -euo pipefail
          VER="${{ steps.v.outputs.tag }}"
          ZIP="panoptent-chrome-$VER.zip"
          API="https://chromewebstore.googleapis.com"
          ITEM="publishers/$CWS_PUBLISHER_ID/items/$CWS_EXTENSION_ID"

          b64() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          KEY=$(mktemp); trap 'rm -f "$KEY"' EXIT
          echo "$CWS_SA_KEY" | jq -r .private_key > "$KEY"
          EMAIL=$(echo "$CWS_SA_KEY" | jq -r .client_email)
          NOW=$(date +%s)
          HEAD=$(printf '{"alg":"RS256","typ":"JWT"}' | b64)
          CLAIM=$(jq -nc --arg iss "$EMAIL" --argjson iat "$NOW" '{iss:$iss, scope:"https://www.googleapis.com/auth/chromewebstore", aud:"https://oauth2.googleapis.com/token", iat:$iat, exp:($iat+3600)}' | b64)
          SIG=$(printf '%s.%s' "$HEAD" "$CLAIM" | openssl dgst -sha256 -sign "$KEY" -binary | b64)
          tok=$(curl -sS https://oauth2.googleapis.com/token \
            --data-urlencode grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer \
            --data-urlencode assertion="$HEAD.$CLAIM.$SIG")
          TOKEN=$(echo "$tok" | jq -r '.access_token // empty')
          [ -n "$TOKEN" ] || { echo "::error::Could not get an access token: $(echo "$tok" | jq -c 'del(.access_token)')"; exit 1; }
          echo "::add-mask::$TOKEN"
          auth=(-H "Authorization: Bearer $TOKEN")

          st=$(curl -sS "${auth[@]}" "$API/v2/$ITEM:fetchStatus")
          echo "status: $st"
          if echo "$st" | jq -e '.error' >/dev/null; then
            echo "::error::fetchStatus failed. Is the service account added in the Developer Dashboard → Account, and is CWS_PUBLISHER_ID right?"; exit 1
          fi
          if echo "$st" | jq -e --arg v "$VER" '[.publishedItemRevisionStatus, .submittedItemRevisionStatus | .distributionChannels[]?.crxVersion] | index($v)' >/dev/null; then
            echo "Version $VER is already published or in review on the Chrome Web Store — OK."; exit 0
          fi

          up=$(curl -sS -X POST "${auth[@]}" -H "Content-Type: application/zip" \
            --data-binary @"$ZIP" "$API/upload/v2/$ITEM:upload")
          echo "upload: $up"
          state=$(echo "$up" | jq -r '.uploadState // empty')
          for i in $(seq 1 30); do
            [ "$state" = "IN_PROGRESS" ] || break
            sleep 5
            state=$(curl -sS "${auth[@]}" "$API/v2/$ITEM:fetchStatus" | jq -r '.lastAsyncUploadState // empty')
            echo "upload state: $state"
          done
          [ "$state" = "SUCCEEDED" ] || { echo "::error::Upload did not succeed (state: ${state:-none})."; exit 1; }

          pub=$(curl -sS -X POST "${auth[@]}" -H "Content-Type: application/json" -d '{}' "$API/v2/$ITEM:publish")
          echo "publish: $pub"
          if echo "$pub" | jq -e '.error' >/dev/null; then echo "::error::Publish failed."; exit 1; fi
          echo "Submitted $VER for review (state: $(echo "$pub" | jq -r '.state // "?"')). It goes live automatically once approved."
