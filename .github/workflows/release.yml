name: Release

# Publishes a release when a v* tag is pushed, or when package.json on main
# carries a version that has no release yet (so bumping the version is enough).
on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['package.json', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Resolve version
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then TAG="${GITHUB_REF_NAME#v}"
          else TAG=$(node -p "require('./package.json').version"); fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "v$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$TAG already exists — nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.v.outputs.skip != 'true'
        run: npm ci
      - name: Check versions match
        if: steps.v.outputs.skip != 'true'
        run: |
          TAG="${{ steps.v.outputs.tag }}"
          PKG=$(node -p "require('./package.json').version")
          CHR=$(node -p "require('./chrome/manifest.json').version")
          echo "tag=$TAG package.json=$PKG chrome/manifest.json=$CHR"
          if [ "$TAG" != "$PKG" ] || [ "$TAG" != "$CHR" ]; then
            echo "::error::Version mismatch. Bump package.json and chrome/manifest.json to $TAG."
            exit 1
          fi
      - if: steps.v.outputs.skip != 'true'
        run: npm run typecheck
      - if: steps.v.outputs.skip != 'true'
        run: npm run package
      - if: steps.v.outputs.skip != 'true'
        run: npm run package:chrome
      - name: Release notes from CHANGELOG
        if: steps.v.outputs.skip != 'true'
        run: |
          TAG="${{ steps.v.outputs.tag }}"
          awk -v v="## $TAG" 'index($0, v)==1 {f=1; next} /^## /{if(f) exit} f' CHANGELOG.md > notes.md
          {
            echo
            echo "### Kurulum / Install"
            echo "- **VS Code:** Extensions → ⋯ → *Install from VSIX…* → \`panoptent-$TAG.vsix\`"
            echo "- **Chrome:** unzip \`panoptent-chrome-$TAG.zip\` → \`chrome://extensions\` → Developer mode → *Load unpacked*"
            echo
            echo "Rehber / Guide: https://ceritli.github.io/panoptent/"
          } >> notes.md
          cat notes.md
      - name: Create GitHub release
        if: steps.v.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.v.outputs.tag }}"
          gh release create "$TAG" --target "$GITHUB_SHA" \
            --title "Panoptent $TAG" \
            --notes-file notes.md \
            panoptent-*.vsix panoptent-chrome-*.zip
