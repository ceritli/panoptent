<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;margin:0}body{font-family:Inter,system-ui,sans-serif}
.t{width:var(--w);height:var(--h);background:radial-gradient(circle at 85% 20%,rgba(249,115,22,.35),transparent 55%),linear-gradient(135deg,#14171c,#1f2329);color:#fff;display:flex;align-items:center;gap:var(--g);padding:0 var(--p);overflow:hidden;position:relative}
.t img.logo{width:var(--l);height:var(--l);border-radius:22%;box-shadow:0 10px 30px rgba(0,0,0,.4)}
h1{font-size:var(--f1);font-weight:800;letter-spacing:-.03em;line-height:1}
p{font-size:var(--f2);color:#cbd2da;margin-top:var(--m);line-height:1.3;font-weight:500}
b{color:#fb923c}
.shot{position:absolute;right:-170px;bottom:-70px;width:700px;border-radius:14px;box-shadow:0 30px 60px rgba(0,0,0,.6);border:1px solid #2f343c}
</style></head><body>
<div class="t" id="small" style="--w:440px;--h:280px;--g:18px;--p:30px;--l:84px;--f1:38px;--f2:16px;--m:8px"><img class="logo" src="../chrome/icons/128.png"><div><h1>Panoptent</h1><p>Click an element.<br>Say what to change.<br><b>Claude Code edits the code.</b></p></div></div>
<div class="t" id="marquee" style="--w:1400px;--h:560px;--g:34px;--p:80px;--l:150px;--f1:76px;--f2:25px;--m:16px"><img class="logo" src="../chrome/icons/128.png"><div style="max-width:470px;z-index:1"><h1>Panoptent</h1><p>Click any element in your running app, say what to change — <b>Claude Code edits the source.</b></p></div><img class="shot" src="assets/screenshot-1-hero.png"></div>
</body></html>
